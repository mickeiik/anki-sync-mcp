services:
  anki-mcp:
    build:
      context: .
    image: anki-mcp:0.2.0
    restart: unless-stopped
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      MCP_AUTH_TOKEN_FILE: "/run/secrets/anki_mcp_token"
      ANKI_COLLECTION_PATH: "/data/collection.anki2"
      ANKI_SYNC_USERNAME: "${ANKI_SYNC_USERNAME:-}"
      ANKI_SYNC_PASSWORD_FILE: "/run/secrets/anki_sync_password"
      ANKI_SYNC_HOST: "${ANKI_SYNC_HOST:-}"
      MCP_SCOPES: "${MCP_SCOPES:-read,write,admin}"
      ANKI_SYNC_ON_READ: "${ANKI_SYNC_ON_READ:-false}"
      ANKI_SYNC_ON_WRITE: "${ANKI_SYNC_ON_WRITE:-true}"
      ANKI_ALLOW_DESTRUCTIVE: "${ANKI_ALLOW_DESTRUCTIVE:-false}"
      ANKI_ALLOW_FULL_SYNC: "${ANKI_ALLOW_FULL_SYNC:-false}"
      ANKI_ALLOW_RESTORE: "${ANKI_ALLOW_RESTORE:-false}"
      ANKI_ALLOW_SCHEMA_CHANGES: "${ANKI_ALLOW_SCHEMA_CHANGES:-false}"
      ANKI_ALLOW_REVIEW_ANSWERS: "${ANKI_ALLOW_REVIEW_ANSWERS:-false}"
      ANKI_ALLOW_UNDO: "${ANKI_ALLOW_UNDO:-false}"
      ANKI_ALLOW_IMPORT: "${ANKI_ALLOW_IMPORT:-false}"
      ANKI_MAX_IMPORT_BYTES: "${ANKI_MAX_IMPORT_BYTES:-268435456}"
      ANKI_CONFIRMATION_TTL_SECONDS: "${ANKI_CONFIRMATION_TTL_SECONDS:-300}"
      ANKI_BOOTSTRAP_MODE: "${ANKI_BOOTSTRAP_MODE:-disabled}"
      ANKI_MAX_BATCH_SIZE: "${ANKI_MAX_BATCH_SIZE:-50}"
      MCP_MAX_PAGE_SIZE: "100"
      MCP_MAX_CARD_FIELDS: "100"
      MCP_MAX_RESPONSE_BYTES: "1048576"
      MCP_MAX_REQUEST_BYTES: "1048576"
    secrets:
      - anki_mcp_token
      - anki_sync_password
    volumes:
      - anki_data:/data
    networks:
      - assistant
      - egress
    expose:
      - "8000"

secrets:
  anki_mcp_token:
    file: ./secrets/anki_mcp_token
  anki_sync_password:
    file: ./secrets/anki_sync_password

volumes:
  anki_data:

networks:
  assistant:
    internal: true
  egress: {}
